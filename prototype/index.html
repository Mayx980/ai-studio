"btn" style="width:100%;font-size:12px;margin-top:10px" onclick="uploadFor(null)">${icon('upload')}上传素材</button><div class="panelHint">收藏和个人资产跨项目可用。删除节点不会删除资产。</div>${state.assets.filter(a=>!a.hidden).slice(-3).reverse().map(a=>`<div style="margin-bottom:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden">${media(a,'thumb')}<div style="padding:10px;font-size:11px">${esc(a.name)}</div></div>`).join('')}`}</aside>`:''}<section class="board ${collapsed?'collapsed':''}" id="board" aria-label="节点画布"><div class="boardNotice">本地交互演示 · ${running.size?'正在演示生成':'自动保存在此浏览器'}${connectFrom?' · 请点击目标节点左侧圆点':''}</div><div class="world" id="world" style="transform:translate(${offset.x}px,${offset.y}px) scale(${zoom})">${groupMarkup()}<svg class="connections">${p.edges.map(edgeMarkup).join('')}</svg>${p.nodes.map(nodeMarkup).join('')}</div>${!p.nodes.length?`<div class="boardEmpty"><div style="color:#b9aee2">${icon('spark')}</div><h2>一个故事，从这里开始</h2><p>右键画布，或选择一种节点开启创作</p><div class="row">${Object.keys(kinds).map(k=>`<button class="btn" onclick="addNode('${k}')">${icon(k)}${kinds[k]}</button>`).join('')}</div></div>`:''}<div class="boardTools"><button class="iconBtn" id="undoBtn" title="撤销 ⌘Z" onclick="historyMove('undo')">${icon('undo')}</button><button class="iconBtn" id="redoBtn" title="恢复 ⇧⌘Z" onclick="historyMove('redo')">${icon('redo')}</button><span class="toolDivider"></span><button class="iconBtn" title="缩小" onclick="setZoom(-.1)">${icon('minus')}</button><span class="zoomText">${Math.round(zoom*100)}%</span><button class="iconBtn" title="放大" onclick="setZoom(.1)">${icon('plus')}</button><span class="toolDivider"></span><button class="iconBtn" title="适应画布" onclick="fitCanvas()">${icon('fit')}</button></div></section></div>`;bindBoard();updateTools()}

function nodeMarkup(n){const a=asset(n.output),refs=n.refs.map(r=>{const a=asset(r.id);return a?`<div class="refChip" title="${esc(a.name)}">${a.kind==='image'?`<img src="${esc(a.url)}" alt="">`:icon(a.kind)}<span>${esc(a.name)} · ${esc(r.use)}</span><button aria-label="移除参考" onclick="removeRef('${n.id}','${r.id}')">×</button></div>`:''}).join('');return `<article class="node ${selected.has(n.id)?'selected':''}" id="node-${n.id}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="port in" title="输入连线" onclick="finishConnection('${n.id}')"></div><div class="port out" title="开始连线" onclick="startConnection('${n.id}')"></div><div class="nodeHead" data-drag="${n.id}"><span class="nodeBadge ${n.kind}Badge">${icon(n.kind)}</span><span>${esc(n.name)}</span><span class="status ${running.has(n.id)?'running':''}">${running.has(n.id)?'演示生成中':'就绪'}</span><button class="iconBtn" title="节点菜单" onclick="event.stopPropagation();nodeMenu(event,'${n.id}')">${icon('more')}</button></div><div class="nodeBody"><div class="refRow">${refs}</div>${n.kind==='audio'?`<textarea class="speech" aria-label="配音正文" placeholder="配音正文（音乐模式可留空）" oninput="editText('${n.id}','speech',this.value)">${esc(n.speech)}</textarea>`:''}<textarea aria-label="${kinds[n.kind]}节点提示词" placeholder="${n.kind==='audio'?'描述声音、情绪和表达要求…':'输入你的创意，或引用收藏的提示词…'}" oninput="editText('${n.id}','prompt',this.value)">${esc(n.prompt)}</textarea><div class="nodeActions"><button class="iconBtn" title="优化提示词" aria-label="优化提示词" onclick="optimize('${n.id}')">${icon('spark')}</button><button class="iconBtn" title="收藏提示词或配置" aria-label="收藏提示词或配置" onclick="favoritePrompt('${n.id}')">${icon('star')}</button><button class="iconBtn" title="引用资产与收藏" aria-label="引用资产与收藏" onclick="openLibrary('node','${n.id}')">${icon('link')}</button></div><div class="nodeSettings"><select aria-label="模型" onchange="modelChange('${n.id}',this.value)">${(n.kind==='text'?['演示文本模型']:n.kind==='image'?['演示生图模型','演示生图模型 · 无参考']:n.kind==='video'?['演示视频模型' function media(a,mode=''){if(a.kind==='image')return `<img src="${esc(a.url)}" alt="${esc(a.name)}" style="${mode==='thumb'?'width:100%;height:105px;object-fit:cover':''}">`;if(a.kind==='video')return `<video src="${esc(a.url)}" poster="${esc(a.poster||art(0))}" controls playsinline style="${mode==='thumb'?'width:100%;height:105px;object-fit:cover':''}"></video>`;return `<div style="padding:12px;background:linear-gradient(120deg,#f4edf8,#f9f0e8);color:#b599c5">${icon('audio')} <span class="small">${esc(a.name)}</span></div><audio src="${esc(a.url)}" controls style="width:100%;height:40px"></audio>`}
function edgeMarkup(e){const a=node(e.from),b=node(e.to);if(!a||!b)return '';const x=a.x+290,y=a.y+44,tx=b.x,ty=b.y+44;return `<path d="M${x} ${y}C${x+90} ${y} ${tx-90} ${ty} ${tx} ${ty}"/>`}
function groupMarkup(){return project().groups.map(g=>{const ns=project().nodes.filter(n=>g.nodes.includes(n.id));if(!ns.length)return '';const x=Math.min(...ns.map(n=>n.x))-20,y=Math.min(...ns.map(n=>n.y))-26,w=Math.max(...ns.map(n=>n.x))+310-x,h=Math.max(...ns.map(n=>n.y))+520-y;return `<div class="groupBox" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span>${esc(g.name)}</span></div>`}).join('')}

async function generate(id){const n=node(id);if(running.has(id)){running.get(id).abort();running.delete(id);renderWorkspace();return toast('演示任务已停止，已有结果保留')}if(!n.prompt.trim())return toast('请先输入提示词');if(n.model.includes('无参考')&&n.refs.length)return toast('模型不支持参考素材，请先移除或更换模型');if(n.kind==='audio'&&n.model==='演示配音模型'&&!n.speech.trim())return toast('请填写配音正文');flushText();const controller=new AbortController(),targetPid=pid,snapshot=clone(n);running.set(id,controller);renderWorkspace();try{await new Promise((r,j)=>{const t=setTimeout(r,1100);controller.signal.addEventListener('abort',()=>{clearTimeout(t);j(new Error('cancelled'))})});if(snapshot.kind==='text'){const text='沿着晨光出发，把城市留在身后。\n在山与湖之间，找回生活的呼吸。\n\n'+snapshot.prompt+'\n\n（以上为演示文本，可直接编辑。）';const target=state.projects.find(p=>p.id===targetPid)?.nodes.find(n=>n.id===id);if(target)target.resultText=text;}else{let url,poster;if(snapshot.kind==='image')url=art(state.assets.length%3);else if(snapshot.kind==='audio')url=audioDemo();else{url=await videoDemo(controller.signal);poster=art(0)}if(controller.signal.aborted)throw new Error('cancelled');const a={id:uid(),kind:snapshot.kind,name:snapshot.prompt.slice(0,16),url,poster,source:state.projects.find(p=>p.id===targetPid)?.name||'已关闭项目',created:Date.now(),version:1,demo:true};state.assets.push(a);const target=state.projects.find(p=>p.id===targetPid)?.nodes.find(n=>n.id===id);if(target){target.output=a.id;target.history.push(a.id)}}persist();toast('演示生成完成'+(snapshot.kind==='text'?'':'，结果已进入个人资产'))}catch(e){if(e.message!=='cancelled')toast('演示生成失败：'+e.message+'。输入与已有结果已保留。')}finally{running.delete(id);if(page==='workspace')renderWorkspace()}}
function audioDemo(){const rate=12000,length=rate*3,buf=new ArrayBuffer(44+length*2),v=new DataView(buf),str=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,36+length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,length*2,true);for(let i=0;i<length;i++){const t=i/rate,f=[261.63,329.63,392,523.25][Math.floor(t/.75)%4],env=Math.sin(Math.PI*(t%.75)/.75)*.3;v.setInt16(44+i*2,Math.sin(t*f*2*Math.PI)*env*20000,true)}return 'data:audio/wav;base64,'+bytes64(new Uint8Array(buf))}
function bytes64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function videoDemo(signal){if(!globalThis.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('当前浏览器不支持演示片段录制，可上传真实视频');const c=document.createElement('canvas');c.width=480;c.height=270;const ctx=c.getContext('2d'),img=new Image();img.src=art(0);await img.decode();const stream=c.captureStream(12),type=['video/webm;codecs=vp8','video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type){stream.getTracks().forEach(t=>t.stop());throw new Error('当前浏览器不支持演示视频编码')}const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:180000});return await new Promise((resolve,reject)=>{const chunks=[];let frame=0;const tick=setInterval(()=>{ctx.drawImage(img,-frame*.2,0,490,275);ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText('演示片段 · 非 AI 生成',15,250);frame++},80);let stopTimer;const clean=()=>{clearInterval(tick);clearTimeout(stopTimer);stream.getTracks().forEach(t=>t.stop())};rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=()=>{clean();reject(new Error('演示录制失败'))};rec.onstop=async()=>{clean();if(signal.aborted)return reject(new Error('cancelled'));const bytes=new Uint8Array(await new Blob(chunks).arrayBuffer());resolve('data:'+type.split(';')[0]+';base64,'+bytes64(bytes))};rec.start();stopTimer=setTimeout(()=>rec.stop(),1600);signal.addEventListener('abort',()=>{if(rec.state!=='inactive')rec.stop()},{once:true})})}

function selectAsset(id){const l=libraryState,a=asset(id);if(l.mode==='browse')return previewAsset(id);if(l.mode==='canvas'&&['prompt','config'].includes(a.kind))return toast('请创建节点后选择');const n=node(l.nodeId);if(l.mode==='node'&&!['prompt','config'].includes(a.kind)&&n){if(n.model.includes('无参考'))return toast('当前模型不支持参考素材');if(n.kind==='image'&&a.kind!=='image')return toast('当前图片模型仅支持图片参考');if(n.kind==='video'&&a.kind==='audio')return toast('当前演示视频模型不支持参考音频');if(n.kind==='audio'&&a.kind!=='audio')return toast('当前演示音频模型仅支持参考音频')}if(l.selected.includes(id))l.selected=l.selected.filter(x=>x!==id);else{const isText=['prompt','config'].includes(a.kind),hasText=l.selected.some(x=>['prompt','config'].includes(asset(x).kind));if(isText||hasText)l.selected=[];const max=n?.kind==='video'?2:4;if(l.mode==='node'&&!isText&&l.selected.length+(n?.refs.length||0)>=max)return toast('已达到当前模型参考数量上限：'+max);l.selected.push(id)}renderAssetCards()}
function renameAsset(id){const a=asset(id),name=prompt('重命名',a.name);if(!name?.trim())return;a.name=name.trim();a.manualName=true;persist();refreshLibrary()}
function removeAsset(id){const l=libraryState,a=asset(id);if(!confirm(l.tab==='personal'?'从个人资产列表移除？已有节点、收藏和历史结果仍保留。':'取消此收藏？个人资产与项目不受影响。'))return;if(l.tab==='personal'){a.hidden=true;}else state.favorites=state.favorites.filter(f=>f.id!==id);l.selected=l.selected.filter(x=>x!==id);persist();refreshLibrary()}
function previewAsset(id){const a=asset(id);const win=document.createElement('div');win.className='overlay';win.style.zIndex=45;win.innerHTML=`<div class="modal"><div class="modalHeader"><h2>${esc(a.name)}</h2><button class="iconBtn" aria-label="关闭预览">${icon('close')}</button></div><div class="modalContent">${['prompt','config'].includes(a.kind)?'<div class="comparison" style="max-height:420px">'+esc(a.kind==='prompt'?a.text:JSON.stringify(a.config,null,2))+'</div>':media(a)}<p class="small muted">${esc(a.source)} · 收藏内容与媒体版本</p></div></div>`;win.querySelector('button').onclick=()=>win.remove();win.onclick=e=>{if(e.target===win)win.remove()};document.body.append(win)}
function applyLibrary(){const l=clone(libraryState),items=l.selected.map(asset).filter(Boolean);if(!items.length)return;if(l.mode==='canvas'){change(()=>items.forEach((a,i)=>{const n=makeNode(a.kind,contextPos.x+(i%3)*330,contextPos.y+Math.floor(i/3)*530);n.output=a.mediaId||a.id;n.history=[n.output];project().nodes.push(n)}));closeModal();toast('已创建 '+items.length+' 个媒体节点，未自动生成');return}const n=node(l.nodeId);if(!n)return toast('目标节点已不存在');if(items[0].kind==='prompt')return previewPromptApply(items[0],n);if(items[0].kind==='config')return previewConfigApply(items[0],n);change(()=>items.forEach(a=>{const id=a.mediaId||a.id;if(!node(n.id).refs.some(r=>r.id===id))node(n.id).refs.push({id,use:'参考'+kinds[a.kind]})}));closeModal();toast('参考素材已添加，可撤销；未自动生成')}
function previewPromptApply(a,n){modal('应用'+(a.subtype||'提示词'),`<div class="field"><label>替换前</label><div class="comparison">${esc(n.prompt||'（空）')}</div></div><div class="field"><label>收藏内容</label><div class="comparison">${esc(a.text)}</div></div>${n.kind==='text'&&a.subtype==='文案'?'<label class="checkRow"><input id="applyBody" type="checkbox">载入文字正文编辑区（不替换提示词）</label>':''}`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="applyPrompt">确认应用</button>`);$('#applyPrompt').onclick=()=>{const key=$('#applyBody')?.checked?'resultText':'prompt';change(()=>node(n.id)[key]=a.text);closeModal();toast('已应用收藏内容，可撤销')}}
function previewConfigApply(a,n){const labels={model:'模型',ratio:'画面比例',images:'参考图片',videos:'参考视频'};modal('预览收藏配置',`<div class="notice">仅替换勾选字段。参考图片、视频分别替换对应类别；不自动执行生成。</div>${Object.entries(a.config).map(([k,v])=>{const incompatible=k==='model'&&a.nodeKind!==n.kind||k==='ratio'&&n.kind==='audio'||k==='videos'&&n.kind!=='video';return `<label class="checkRow"><input type="checkbox" data-config="${k}" ${incompatible?'disabled':'checked'}>${labels[k]}<span class="muted small">${Array.isArray(v)?v.length+' 项':esc(v)}${incompatible?' · 当前节点不兼容':''}</span></label>`}).join('')}`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="applyConfig">应用勾选配置</button>`);$('#applyConfig').onclick=()=>{const keys=[...dialogs.querySelectorAll('[data-config]:checked')].map(el=>el.dataset.config);if(!keys.length)return toast('请选择有效配置字段');const next=clone(node(n.id));for(const k of keys){if(k==='model'||k==='ratio')next[k]=a.config[k];else{const kind=k==='images'?'image':'video';next.refs=next.refs.filter(r=>asset(r.id)?.kind!==kind).concat(clone(a.config[k]))}}if(next.model.includes('无参考')&&next.refs.length)return toast('组合后的配置不兼容：该模型不支持参考素材');if(next.refs.length>(next.kind==='video'?2:4))return toast('配置超出当前模型参考数量限制');change(()=>Object.assign(node(n.id),next));closeModal();toast('配置已整体应用，可一步撤销')}}
function exportData(){flushText();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='映造Studio-演示备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('演示数据已导出，不包含 API Key')}
$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const value=JSON.parse(await f.text());if(value.version!==2||!Array.isArray(value.projects)||!Array.isArray(value.assets)||!Array.isArray(value.favorites))throw new Error();const validId=v=>typeof v==='string'&&/^[a-zA-Z0-9_-]+$/.test(v);for(const p of value.projects)if(!validId(p.id)||!Array.isArray(p.nodes)||!Array.isArray(p.edges)||!Array.isArray(p.groups)||p.nodes.some(n=>!validId(n.id)||!Object.keys(kinds).includes(n.kind)||!Number.isFinite(n.x)||!Number.isFinite(n.y)||typeof n.prompt!=='string'||typeof n.model!=='string'||!Array.isArray(n.refs)||n.refs.some(r=>!validId(r.id))||!Array.isArray(n.history)||n.history.some(id=>!validId(id))))throw new Error();for(const a of [...value.assets,...value.favorites])if(!validId(a.id))throw new Error();for(const a of [...value.assets,...value.favorites])if(a.url&&!/^data:(image\/(png|jpeg|gif|webp|svg\+xml)|video\/(webm|mp4)|audio\/(wav|mpeg|mp4|ogg))[;,]/i.test(a.url))throw new Error();if(!confirm('导入会替换当前浏览器中的演示项目与资产，建议先导出备份。继续吗？'))return;for(const task of running.values())task.abort();running.clear();state=value;histories={};persist();closeModal();go('home');toast('演示数据已导入')}catch{toast('文件格式不正确，请选择本原型导出的 JSON 文件')}e.target.value=''};
document.addEventListener('click',e=>{if(!e.target.closest('.context,.nodeHead'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModal();connectFrom=null;return}if(page!=='workspace'||dialogs.innerHTML)return;const editing=e.target.closest('input,textarea,[contenteditable]');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();historyMove(e.shiftKey?'redo':'undo')}else if(!editing&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();deleteNodes()}else if(!editing&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='g'){e.preventDefault();groupSelected()}});
window.addEventListener('beforeunload',()=>{flushText();persist()});persist();render();
</script></body></html>
