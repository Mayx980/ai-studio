<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
  <rect width="1040" height="620" fill="#141414"/>
  <g font-family="WenQuanYi Zen Hei, sans-serif" fill="#e5e7eb">
    <text x="40" y="46" font-size="22">AFXEN 用户中心局部方案</text>
    <text x="40" y="76" font-size="14" fill="#a1a1aa">示意图：沿用现有组件和主题，仅移除账号管理并保留本人改密</text>
    <rect x="40" y="116" width="260" height="300" rx="12" fill="#222222" stroke="#404040"/>
    <text x="60" y="153" font-size="18">用户中心</text>
    <text x="60" y="200" font-size="16">外观与设置</text>
    <rect x="52" y="220" width="236" height="44" rx="8" fill="#303030"/>
    <text x="60" y="249" font-size="16">修改密码</text>
    <text x="60" y="301" font-size="16">切换账号</text>
    <text x="60" y="353" font-size="16">退出登录</text>
    <rect x="360" y="116" width="480" height="440" rx="12" fill="#222222" stroke="#404040"/>
    <text x="384" y="153" font-size="20">修改密码</text>
    <text x="384" y="192" font-size="14" fill="#ef9292">当前密码错误</text>
    <text x="384" y="222" font-size="15">当前密码</text>
    <rect x="384" y="232" width="432" height="44" rx="6" fill="#171717" stroke="#525252"/>
    <text x="400" y="260" font-size="16">***************</text>
    <text x="384" y="306" font-size="15">新密码（15–128字符）</text>
    <rect x="384" y="316" width="432" height="44" rx="6" fill="#171717" stroke="#525252"/>
    <text x="400" y="344" font-size="16">***************</text>
    <text x="384" y="390" font-size="15">再次输入新密码</text>
    <rect x="384" y="400" width="432" height="44" rx="6" fill="#171717" stroke="#525252"/>
    <text x="400" y="428" font-size="16">***************</text>
    <rect x="384" y="476" width="196" height="44" rx="6" fill="#409eff"/>
    <text x="404" y="505" font-size="16" fill="#ffffff">修改并重新登录</text>
    <text x="40" y="594" font-size="14" fill="#a1a1aa">状态：提交中防重复；失败保留输入；关闭前确认；成功撤销原会话并重新登录</text>
  </g>
